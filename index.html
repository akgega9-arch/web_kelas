<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>spin siswa DKV 1</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <style>
    * {
      box-sizing: border-box;
    }
    html,body {
      margin: 0;
      height: 100%;
      background: #04050b;
      color: #f4efe6;
      font-family: system-ui,sans-serif;
      overflow: hidden;
    }

    /* Kanvas & lapisan efek */
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #wv {
      display: none;
      z-index: 1;
      pointer-events: none;
    }
    #flash {
      position: fixed;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 4;
    }
    #sl {
      position: fixed;
      inset: -30%;
      background: repeating-conic-gradient(from 0deg,rgba(190,215,255,.7) 0 .5deg,transparent .5deg 5deg);
      -webkit-mask: radial-gradient(circle,transparent 14%,#000 62%);
      mask: radial-gradient(circle,transparent 14%,#000 62%);
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* Antarmuka utama (judul, tombol GACHA) */
    #ui {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 28px);
      pointer-events: none;
      z-index: 2;
    }
    #top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      font-size: 14px;
      letter-spacing: .35em;
      margin: 0;
      opacity: .75;
    }
    button {
      pointer-events: auto;
      font: inherit;
      cursor: pointer;
    }
    .tb {
      display: flex;
      gap: 8px;
    }
    #mb,
    #mu {
      background: #0008;
      color: #fff;
      border: 1px solid #fff4;
      border-radius: 10px;
      font-size: 20px;
      padding: 4px 12px;
    }
    #go {
      padding: 16px 54px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .25em;
      color: #fff;
      border: 1px solid #7fb2ff;
      border-radius: 99px;
      background: linear-gradient(135deg,#ff8a2b88,#2f7bff88);
      box-shadow: 0 0 40px #4a8cff77;
    }
    #go:disabled {
      opacity: .4;
      cursor: default;
      box-shadow: none;
    }

    /* Panel samping: daftar nama & hasil kelompok */
    #dr {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(360px,100%);
      background: #0a0c1af0;
      border-left: 1px solid #fff2;
      padding: calc(env(safe-area-inset-top,0px) + 56px) 16px 20px;
      overflow: auto;
      transform: translateX(100%);
      transition: .3s;
      z-index: 5;
    }
    #dr.o {
      transform: none;
    }
    textarea,input {
      width: 100%;
      background: #fff1;
      border: 1px solid #fff3;
      color: #fff;
      border-radius: 8px;
      padding: 8px;
      font: inherit;
    }
    textarea {
      height: 160px;
    }
    label {
      font-size: 13px;
      opacity: .8;
      display: block;
      margin: 10px 0 4px;
    }
    #ap {
      margin-top: 10px;
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 0;
      background: #ffb35c;
      color: #210;
      font-weight: 700;
    }
    .g {
      background: #fff1;
      border-radius: 8px;
      padding: 8px 10px;
      margin: 6px 0;
      font-size: 14px;
    }
    .g b {
      color: #7fb2ff;
    }

    /* Tombol reset (kiri bawah) */
    #rst {
      position: fixed;
      left: 14px;
      bottom: calc(env(safe-area-inset-bottom,0px) + 28px);
      z-index: 3;
      background: #0008;
      color: #fff;
      border: 1px solid #fff4;
      border-radius: 99px;
      padding: 10px 16px;
      font-size: 14px;
    }
    #dr {
      padding-bottom: 96px;
    }
    #cl {
      position: fixed;
      top: calc(env(safe-area-inset-top,0px) + 10px);
      right: 12px;
      z-index: 6;
      background: #fff2;
      color: #fff;
      border: 1px solid #fff4;
      border-radius: 10px;
      font-size: 20px;
      padding: 4px 14px;
    }
    #df {
      position: fixed;
      bottom: 0;
      right: 0;
      width: min(360px,100%);
      padding: 12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);
      background: #0a0c1af8;
      border-top: 1px solid #fff2;
      z-index: 6;
    }
    #df #ap {
      margin: 0;
    }

    /* Petunjuk lewati & tabel hasil akhir */
    #hint {
      position: fixed;
      top: calc(env(safe-area-inset-top,0px) + 46px);
      left: 0;
      right: 0;
      text-align: center;
      font-size: 11px;
      letter-spacing: .25em;
      opacity: 0;
      transition: opacity .4s;
      pointer-events: none;
      z-index: 3;
    }
    #fin {
      position: fixed;
      inset: 0;
      z-index: 7;
      background: radial-gradient(circle at 50% 0,#14204a 0,#04050b 70%);
      padding: calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);
      overflow: auto;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s;
    }
    #fin.o {
      opacity: 1;
      pointer-events: auto;
    }
    #fin h2 {
      text-align: center;
      letter-spacing: .35em;
      font-size: clamp(16px,3vw,28px);
      margin: 6px 0 18px;
    }
    #fg {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(min(100%,200px),1fr));
      gap: 12px;
    }
    .fc {
      background: #ffffff12;
      border: 1px solid #7fb2ff55;
      border-radius: 14px;
      padding: 12px 14px;
      box-shadow: 0 0 24px #4a8cff22;
    }
    .fc b {
      display: block;
      color: #ffb35c;
      letter-spacing: .2em;
      font-size: 13px;
      margin-bottom: 6px;
    }
    .fc div {
      font-size: clamp(14px,2.2vw,20px);
      padding: 2px 0;
    }
    #fx {
      display: block;
      margin: 18px auto 0;
      padding: 10px 28px;
      border-radius: 99px;
      border: 1px solid #fff4;
      background: #fff1;
      color: #fff;
    }
  </style>
</head>
<body>
  <!-- Kanvas: galaksi (WebGL) dan gelombang suara (2D) -->
  <canvas id="c"></canvas>
  <canvas id="wv"></canvas>
  <div id="sl"></div>
  <div id="flash"></div>

  <!-- Antarmuka utama -->
  <div id="ui">
    <div id="top">
      <h1>SPIN KELOMPOK</h1>
      <div class="tb">
        <button id="mu" aria-label="Suara">🔊</button>
        <button id="mb">☰</button>
      </div>
    </div>
    <button id="go">SPIN</button>
  </div>
  <button id="rst">↺ Reset</button>

  <!-- Panel samping: daftar nama, jumlah kelompok, hasil -->
  <aside id="dr">
    <button id="cl" aria-label="Tutup">✕</button>
    <label>Daftar nama </label>
    <textarea id="tx"></textarea>
    <label>Jumlah kelompok</label>
    <input id="gn" type="number" min="1" value="6">
    <h3>Hasil</h3>
    <div id="gl"></div>
    <div id="df"><button id="ap">Terapkan</button></div>
  </aside>

  <!-- Petunjuk lewati animasi & tabel hasil akhir -->
  <div id="hint">TAP LAYAR UNTUK LEWATI</div>
  <div id="fin">
    <h2>HASIL KELOMPOK</h2>
    <div id="fg"></div>
    <button id="fx">Tutup</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // ==================== Utilitas & renderer Three.js ====================
    const $ = i => document.getElementById(i);
    const cv = $('c');
    const ren = new THREE.WebGLRenderer({ canvas: cv, antialias: false, preserveDrawingBuffer: true });
    ren.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    ren.setClearColor(0x04050b);
    ren.autoClear = false;
    const scene = new THREE.Scene();
    const cam = new THREE.PerspectiveCamera(60, 1, .02, 100);
    function rs() {
        ren.setSize(innerWidth, innerHeight, false);
        cam.aspect = innerWidth / innerHeight;
        cam.updateProjectionMatrix();
    }

    addEventListener('resize', rs);
    rs();
    const VS = `uniform float uTime,uSize,uPix;attribute float aScale;attribute float aRot;attribute vec3 aColor;varying vec3 vC;varying float vR;
void main(){vec4 m=modelMatrix*vec4(position,1.);float a=atan(m.x,m.z),d=length(m.xz);
a+=(.7/max(d,.9)+.06)*uTime;m.x=cos(a)*d;m.z=sin(a)*d;
vec4 v=viewMatrix*m;gl_Position=projectionMatrix*v;
gl_PointSize=min(uSize*aScale*(1.+d*.04)*uPix/max(-v.z,.05),34.);vC=aColor;vR=aRot+uTime*aScale*.5;}`;
    const FS = `uniform float uSq;uniform float uAlpha;varying vec3 vC;varying float vR;
void main(){float s;if(uSq>.5){float dd=distance(gl_PointCoord,vec2(.5));s=uAlpha*smoothstep(.5,.34,dd)*(.7+.6*(1.-dd*2.));}
else{s=1.-distance(gl_PointCoord,vec2(.5))*2.;s=pow(max(s,0.),3.)*uAlpha;}gl_FragColor=vec4(vC*s,s);}`;

    // ==================== Partikel galaksi (debu + serpihan) ====================
    const RAD = 18;
    const BR = 3;
    const SPIN = .37;
    const cIn = new THREE.Color('#ff8a4a');
    const cMid = new THREE.Color('#ff4fa0');
    const cOut = new THREE.Color('#2f7bff');
    const tmp = new THREE.Color();
    function make(count, size, rnd, sq, alpha) {
        const pos = new Float32Array(count * 3);
        const col = new Float32Array(count * 3);
        const sc = new Float32Array(count);
        const rot = new Float32Array(count);
        const rp = (r, k) => Math.pow(Math.random(), 3) * (Math.random() < .5 ? 1 : -1) * rnd * r * k;
        for (let i = 0; i < count; i++) {
            const k = sq ? 1 : (Math.random() < .4 ? 2.4 : .3);
            const r = Math.pow(Math.random(), 1.4) * RAD;
            const ba = (i % BR) / BR * 6.2832;
            const sa = r * SPIN;
            const t = r / RAD;
            pos[i * 3] = Math.cos(ba + sa) * r + rp(r, k);
            pos[i * 3 + 1] = (Math.random() + Math.random() + Math.random() - 1.5) * (.25 + RAD * .012) * (sq ? 3 : 1) + (Math.random() - .5) * RAD * .28 * Math.exp(-r / (RAD * .12));
            pos[i * 3 + 2] = Math.sin(ba + sa) * r + rp(r, k);
            if (t < .5)
                tmp.copy(cIn).lerp(cMid, t * 2);
            else
                tmp.copy(cMid).lerp(cOut, (t - .5) * 2);
            if (Math.random() < .2)
                tmp.set(Math.random() < .5 ? '#3d8bff' : '#5fd4ff');
            col[i * 3] = tmp.r;
            col[i * 3 + 1] = tmp.g;
            col[i * 3 + 2] = tmp.b;
            sc[i] = .3 + Math.random();
            rot[i] = Math.random() * 6.2832;
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        g.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
        g.setAttribute('aScale', new THREE.BufferAttribute(sc, 1));
        g.setAttribute('aRot', new THREE.BufferAttribute(rot, 1));
        const m = new THREE.ShaderMaterial({ vertexShader: VS, fragmentShader: FS, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
            uniforms: { uTime: { value: 0 }, uSize: { value: size }, uPix: { value: ren.getPixelRatio() }, uSq: { value: sq }, uAlpha: { value: alpha } } });
        scene.add(new THREE.Points(g, m));
        return m;
    }

    const dust = make(100000, 60, .45, 0, 1);
    const shards = make(5000, 160, .7, 1, .6);

    // ==================== Sprite titik terang: bintang, halo, cincin, kilau ====================
    function tex(fn) {
        const c = document.createElement('canvas');
        c.width = c.height = 128;
        const g = c.getContext('2d');
        fn(g);
        return new THREE.CanvasTexture(c);
    }

    const glowT = tex(g => {
        const r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
        r.addColorStop(0, '#fff');
        r.addColorStop(.25, 'rgba(190,220,255,.8)');
        r.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = r;
        g.fillRect(0, 0, 128, 128);
    });

    const ringT = tex(g => {
        g.strokeStyle = '#bfe0ff';
        g.lineWidth = 5;
        g.shadowColor = '#4a8cff';
        g.shadowBlur = 14;
        g.beginPath();
        g.arc(64, 64, 46, 0, 6.283);
        g.stroke();
    });

    const flareT = tex(g => {
        g.translate(64, 64);
        const spike = (len, w, a) => {
            g.save();
            g.rotate(a);
            const gr = g.createLinearGradient(-len, 0, len, 0);
            gr.addColorStop(0, 'rgba(255,255,255,0)');
            gr.addColorStop(.5, 'rgba(255,255,255,.95)');
            gr.addColorStop(1, 'rgba(255,255,255,0)');
            g.fillStyle = gr;
            g.beginPath();
            g.moveTo(-len, 0);
            g.lineTo(0, -w);
            g.lineTo(len, 0);
            g.lineTo(0, w);
            g.closePath();
            g.fill();
            g.restore();
        };
        spike(62, 3.2, 0);
        spike(62, 3.2, Math.PI / 2);
        spike(34, 1.8, Math.PI / 4);
        spike(34, 1.8, -Math.PI / 4);
    });

    const SP = [];
    const mk = (t, col) => {
        const m = new THREE.SpriteMaterial({ map: t, color: col, transparent: true, opacity: 0, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending });
        const s = new THREE.Sprite(m);
        scene.add(s);
        SP.push(s);
        return s;
    };

    const starM = mk(glowT, 0xffffff);
    const haloM = mk(glowT, 0x3d7bff);
    const ringM = mk(ringT, 0x8fc4ff);
    const ring2 = mk(ringT, 0xffa860);
    const flareM = mk(flareT, 0xffffff);
    const target = new THREE.Vector3();

    // ==================== Lapisan gelap untuk transisi ====================
    const fScene = new THREE.Scene();
    const fCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const fMat = new THREE.MeshBasicMaterial({ color: 0x04050b, transparent: true, opacity: 1, depthTest: false, depthWrite: false });
    fScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), fMat));

    // ==================== Animasi kamera: zoom ke titik terang (galaksi) ====================
    const sm = (a, b, x) => {
        x = Math.min(1, Math.max(0, (x - a) / (b - a)));
        return x * x * (3 - 2 * x);
    };

    const D = 7;
    const clock = new THREE.Clock();
    const flash = $('flash');
    const sl = $('sl');
    const pB = new THREE.Vector3();
    const look = new THREE.Vector3();
    const O = new THREE.Vector3();
    const UP = new THREE.Vector3(0, 1, 0);
    const C = new THREE.Vector3();
    const E = new THREE.Vector3();
    const dv = new THREE.Vector3();
    const side = new THREE.Vector3();
    let tA = 0;
    let state = 'idle';
    let t0 = 0;
    let cur = null;
    let sgn = 1;
    let hit = -9;
    let rp = 0;
    function tick() {
        const dt = Math.min(clock.getDelta(), .05);
        const t = clock.elapsedTime;
        const pull = state === 'pull';
        let u = 0;
        if (pull) {
            u = (t - t0) / D;
            if (u >= 1)
                finish(t);
        }
        const pl = state === 'pull';
        const zz = pl ? sm(.1, .9, u) : 0;
        const q = Math.pow(Math.min(1, Math.max(0, (u - .04) / .86)), 1.9);
        tA += dt * (1 + (pl ? 4 * sm(0, .2, u) + 12 * Math.pow(sm(.5, .9, u), 2) : 0));
        dust.uniforms.uTime.value = tA;
        shards.uniforms.uTime.value = tA;
        const phi = .95 + Math.sin(t * .25) * .03;
        const th = .6 + Math.sin(t * .15) * .12;
        pB.set(22 * Math.sin(phi) * Math.cos(th), 22 * Math.cos(phi) + .02, 22 * Math.sin(phi) * Math.sin(th));
        let roll = 0;
        if (pl) {
            dv.copy(target).sub(pB);
            side.crossVectors(dv, UP).normalize();
            C.copy(pB).addScaledVector(dv, .45).addScaledVector(side, 3 * sgn);
            C.y += 1.5;
            E.copy(pB).sub(target).normalize().multiplyScalar(.12).add(target);
            const a = (1 - q) * (1 - q);
            const b = 2 * (1 - q) * q;
            const c = q * q;
            cam.position.set(pB.x * a + C.x * b + E.x * c, pB.y * a + C.y * b + E.y * c, pB.z * a + C.z * b + E.z * c);
            look.lerpVectors(O, target, sm(0, .35, u));
            roll = Math.sin(q * 3.1416) * .12 * sgn;
        }
        else {
            cam.position.copy(pB);
            look.copy(O);
        }
        cam.up.copy(UP);
        cam.fov = pl ? 60 + 50 * Math.pow(sm(.35, .92, u), 1.5) : 60;
        cam.updateProjectionMatrix();
        cam.lookAt(look);
        cam.rotateZ(roll);
        const on = pl ? sm(0, .04, u) : 0;
        const on2 = on;
        rp += dt * (.9 + 2.5 * zz);
        const S = (s, v) => {
            s.scale.setScalar(v);
            s.position.copy(target);
        };
        const bg = 1 + zz * zz * 1.5;
        const su = Math.max(.12 * bg, .04 * cam.position.distanceTo(target));
        starM.material.opacity = on;
        S(starM, su * (1 + Math.sin(t * 14) * .1));
        haloM.material.opacity = on2 * .5;
        S(haloM, su * 4 * (1 + Math.sin(t * 5) * .1));
        flareM.material.opacity = on2 * .8;
        S(flareM, su * 7 * (1 + Math.sin(t * 9) * .1));
        const ph = rp % 1;
        const ph2 = (rp + .5) % 1;
        ringM.material.opacity = on2 * (1 - ph) * .9;
        S(ringM, su * (.6 + ph * 10));
        ring2.material.opacity = on2 * (1 - ph2) * .9;
        S(ring2, su * (.6 + ph2 * 10));
        fMat.opacity = pl ? 1 - .82 * sm(.15, .55, u) * (1 - sm(.9, .99, u)) : 1;
        let amp = Math.max(0, 1 - (t - hit) / .7) * 16;
        if (pl) {
            amp += 3 * sm(0, .04, u) * (1 - sm(.06, .16, u)) + 8 * Math.pow(sm(.55, .92, u), 2);
            flash.style.opacity = Math.max(sm(.9, .985, u), u < .05 ? .5 * (1 - u / .05) : 0);
            sl.style.opacity = .75 * sm(.5, .68, u) * (1 - sm(.86, .95, u));
            sl.style.transform = `scale(${1 + zz * 1.2}) rotate(${t * 30}deg)`;
        }
        cv.style.transform = amp > .1 ? `translate(${(Math.random() - .5) * amp}px,${(Math.random() - .5) * amp}px) scale(1.03)` : '';
        if (!((state === 'wave' || state === 'show') && WF.covered())) {
            ren.render(fScene, fCam);
            ren.render(scene, cam);
        }
        requestAnimationFrame(tick);
    }

    tick();

    // ==================== Animasi gelombang suara (36 gaya, kanvas 2D) ====================
    const WF = (() => {
        const cv = document.getElementById('wv');
        const g = cv.getContext('2d');
        let W;
        let H;
        function rs() {
            const D = Math.min(devicePixelRatio || 1, 2);
            W = cv.clientWidth;
            H = cv.clientHeight;
            cv.width = W * D;
            cv.height = H * D;
            g.setTransform(D, 0, 0, D, 0, 0);
        }
        addEventListener('resize', rs);
        const T = 5.5;
        const sm = (a, b, x) => {
            x = Math.min(1, Math.max(0, (x - a) / (b - a)));
            return x * x * (3 - 2 * x);
        };
        function mul(a) {
            return () => {
                a |= 0;
                a = a + 0x6D2B79F5 | 0;
                let t = Math.imul(a ^ a >>> 15, 1 | a);
                t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }
        const R = mul(7);
        const PS = Array.from({ length: 110 }, () => ({ a: R() * 6.283, r: .35 + R() * .9, s: .5 + R() * 1.5, z: 1 + R() * 2.5 }));
        const LN = Array.from({ length: 48 }, () => ({ a: R() * 6.283, l: .3 + R() * .9 }));
        const P = [['#ff3b2f', '#ff9a7a', '#ffffff', '#12030a'], ['#8a4dff', '#d9a8ff', '#ffffff', '#07041a'], ['#ffb02e', '#ffe7a0', '#ffffff', '#0b0603'], ['#3d7bff', '#8fe9ff', '#ffffff', '#030818'], ['#ff3fb4', '#38ffd0', '#ffe94a', '#04070a'], ['#2cff8a', '#c8ffe0', '#ffffff', '#030d07'], ['#ff7a1a', '#ffd23f', '#ffffff', '#100500'], ['#19d3ff', '#ff4fd8', '#ffffff', '#02060d']];
        const TN = ['sq', 'ring', 'shard', 'glitch', 'grid', 'spiral', 'hex', 'tri', 'stars', 'rain', 'beams', 'ripple'];
        const S = Array.from({ length: 36 }, (_, i) => {
            const b = i / 12 | 0;
            const p = P[(i * 5 + b) % 8];
            return { c: p.slice(0, 3), bg: p[3], tun: TN[i % 12], wv: (i * 7 + b) % 15, bt: (i * 5 + b * 2) % 12, mo: (i + b) % 5 };
        });
        let anim = null;
        let deck = [];
        let count = 0;
        let fading = false;
        // percikan cahaya yang naik, dan kilau di sekitar nama (dibuat sekali)

        function fade() {
            if (!ctx) return;
            files.gel.concat(files.grup, files.nama).forEach(f => { if (!f.el.paused) { clearT(f); fadeTo(f, 0, 1.6); } });
            [gbus, rbus].forEach(g => {
                if (!g) return;
                const n = ctx.currentTime;
                g.gain.cancelScheduledValues(n);
                g.gain.setValueAtTime(g.gain.value, n);
                g.gain.linearRampToValueAtTime(0, n + 1.6);
            });
        }
        function stop() {
            allFiles().forEach(f => haltFile(f, .05));
            if (!ctx) return;
            const old = buses;
            buses = [];
            bbus = gbus = rbus = null;
            old.forEach(g => { kill(g, .03); setTimeout(() => { try { g.disconnect(); } catch (e) { } }, 600); });
        }
        function toggle() {
            muted = !muted;
            try { localStorage.setItem('gm', muted ? '1' : '0'); } catch (e) { }
            if (master) master.gain.setTargetAtTime(muted ? 0 : .8, ctx.currentTime, .03);
            allFiles().forEach(f => { f.el.volume = muted ? 0 : Math.min(1, f.v); });
            return muted;
        }
        return { build, finish, skipWave, fade, stop, toggle, groupShow, isMuted: () => muted, files };
    })();

    // ==================== Undian, kelompok, dan antarmuka ====================
    let skipNext = false;
    let lastK = '';
    let names = [];
    let pool = [];
    let groups = [];
    let G = 6;
    let pulls = 0;
    function esc(s) {
        return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    function showFin() {
        $('fg').innerHTML = groups.map((g, i) => `<div class="fc"><b>KELOMPOK ${i + 1}</b>${g.map(n => `<div>${esc(n)}</div>`).join('') || '<div>-</div>'}</div>`).join('');
        $('fin').classList.add('o');
    }

    function hideFin() {
        $('fin').classList.remove('o');
    }

    const AV_A = 22;
    const AV_B = [3, 16, 20, 23];
    const AV_W = .1;
    function cw(n, grp) {
        const a = names.indexOf(n) + 1;
        let w = 1;
        for (const m of grp) {
            const b = names.indexOf(m) + 1;
            if ((a === AV_A && AV_B.includes(b)) || (b === AV_A && AV_B.includes(a)))
                w *= AV_W;
        }
        return w;
    }

    function pick(g) {
        const ws = pool.map(n => cw(n, groups[g]));
        const s = ws.reduce((x, y) => x + y, 0);
        let r = Math.random() * s;
        let i = 0;
        for (; i < pool.length - 1; i++) {
            r -= ws[i];
            if (r <= 0)
                break;
        }
        return pool.splice(i, 1)[0];
    }

    function applyIf() {
        if ($('tx').value + '|' + $('gn').value !== lastK && state === 'idle')
            setup();
    }

    function pull() {
        if (state !== 'idle' || !pool.length)
            return;
        const g = pulls++ % G;
        const n = pick(g);
        groups[g].push(n);
        cur = { n, g };
        sgn = Math.random() < .5 ? -1 : 1;
        const a = Math.random() * 6.283;
        const rr = 4 + Math.random() * 10;
        target.set(Math.cos(a) * rr, (Math.random() - .5) * .2, Math.sin(a) * rr);
        $('wv').style.display = 'none';
        WF.stop();
        $('go').disabled = true;
        state = 'pull';
        skipNext = false;
        SFX.build();
        $('hint').style.opacity = .55;
        t0 = clock.elapsedTime;
        flash.style.transition = 'none';
    }

    // ==================== Pertunjukan kelompok: tiap kelompok mendapat animasi gelombang suara sendiri ====================
    // Setelah semua nama keluar: kelompok 1 tampil dengan animasi + daftar anggotanya, lalu kelompok 2, dst., baru tabel akhir.
    let showTok = 0;
    function startShow() {
        const tok = ++showTok;
        state = 'show';
        upd();
        const nextGroup = i => {
            if (tok !== showTok) return;                      // dibatalkan (Reset / Terapkan)
            if (i >= groups.length) {
                state = 'idle';
                upd();
                showFin();
                return;
            }
            const members = groups[i];
            if (!members || !members.length) {
                nextGroup(i + 1);
                return;
            }
            $('wv').style.display = 'block';
            SFX.groupShow();
            WF.play('KELOMPOK ' + (i + 1), i, () => setTimeout(() => nextGroup(i + 1), 300), members);
        };
        setTimeout(() => nextGroup(0), 400);
    }

    function finish(t) {
        state = 'wave';
        hit = t;
        sl.style.opacity = 0;
        $('wv').style.display = 'block';
        WF.play(cur.n, cur.g, () => {
            state = 'idle';
            upd();
            if (!pool.length)
                setTimeout(startShow, 600);
        });
        SFX.finish(skipNext);
        if (skipNext) {
            WF.skip();
            skipNext = false;
        }
        void flash.offsetWidth;
        flash.style.transition = 'opacity 1.3s';
        flash.style.opacity = 0;
        upd();
        groupsUI();
    }

    function upd() {
        const b = $('go');
        const fin = !pool.length && pulls > 0;
        b.disabled = state !== 'idle' || (!pool.length && !fin);
        b.textContent = pool.length ? `GACHA · ${pool.length}` : (fin ? 'LIHAT HASIL' : 'SELESAI ✓');
        $('hint').style.opacity = state === 'idle' ? 0 : .55;
    }

    function groupsUI() {
        $('gl').innerHTML = groups.map((g, i) => `<div class="g"><b>Kelompok ${i + 1}</b> (${g.length})<br>${g.join(', ') || '-'}</div>`).join('');
    }

    function setup() {
        lastK = $('tx').value + '|' + $('gn').value;
        names = $('tx').value.split('\n').map(s => s.trim()).filter(Boolean);
        G = Math.max(1, parseInt($('gn').value) || 1);
        pool = [...names];
        groups = Array.from({ length: G }, () => []);
        pulls = 0;
        $('wv').style.display = 'none';
        showTok++;
        WF.stop();
        SFX.stop();
        state = 'idle';
        hideFin();
        flash.style.transition = 'none';
        flash.style.opacity = 0;
        sl.style.opacity = 0;
        upd();
        groupsUI();
        try {
            localStorage.setItem('gg', JSON.stringify({ t: $('tx').value, g: G }));
        }
        catch (e) {
        }
    }

    let sv = null;
    try {
        sv = JSON.parse(localStorage.getItem('gg'));
    }

    catch (e) {
    }

    $('tx').value = sv ? sv.t : Array.from({ length: 36 }, (_, i) => 'Siswa ' + (i + 1)).join('\n');
    $('gn').value = sv ? sv.g : 6;
    setup();
    if (!sv)
        $('dr').classList.add('o');
    $('go').onclick = () => {
        if (state === 'idle' && !pool.length && pulls)
            showFin();
        else
            pull();
    };

    addEventListener('pointerdown', e => {
        if (e.target.closest && e.target.closest('button,aside,#fin'))
            return;
        if (state === 'pull') {
            skipNext = true;
            t0 = clock.elapsedTime - D - .01;
        }
        else if (state === 'wave' || state === 'show') {
            const k = WF.skip();
            if (k === 1)
                SFX.skipWave();
            else if (k === 2)
                SFX.fade();
        }
    });

    $('fx').onclick = hideFin;
    $('mu').textContent = SFX.isMuted() ? '🔇' : '🔊';
    $('mu').onclick = () => {
        $('mu').textContent = SFX.toggle() ? '🔇' : '🔊';
    };
    $('tx').onchange = $('gn').onchange = applyIf;
    $('ap').onclick = $('cl').onclick = () => {
        applyIf();
        $('dr').classList.remove('o');
    };

    $('mb').onclick = () => {
        applyIf();
        $('dr').classList.toggle('o');
    };

    let rt = 0;
    $('rst').onclick = () => {
        if (state !== 'idle')
            return;
        const b = $('rst');
        if (!rt) {
            b.textContent = 'Yakin? Tap lagi';
            rt = setTimeout(() => {
                rt = 0;
                b.textContent = '↺ Reset';
            }, 3000);
        }
        else {
            clearTimeout(rt);
            rt = 0;
            b.textContent = '↺ Reset';
            setup();
        }
    };
  </script>
</body>
</html>
